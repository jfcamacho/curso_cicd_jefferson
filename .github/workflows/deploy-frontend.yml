name: CI/CD Frontend - Firebase Hosting

on:
  push:
    branches:
      - qa
      - main
    paths:
      - "frontend/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'production' || 'qa' }}

    concurrency:
      group: frontend-${{ github.ref_name }}
      cancel-in-progress: true

    permissions:
      contents: read

    steps:
      - name: Mostrar ambiente
        run: |
          echo "Rama: ${{ github.ref_name }}"
          echo "Ambiente: ${{ github.ref_name == 'main' && 'PRODUCCIÓN' || 'QA' }}"

      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Desplegar frontend QA
        if: github.ref_name == 'qa'
        run: >
          npx firebase-tools@latest deploy
          --only hosting:qa
          --project "${{ secrets.GCP_PROJECT_ID }}"
          --non-interactive

      - name: Desplegar frontend Producción
        if: github.ref_name == 'main'
        run: >
          npx firebase-tools@latest deploy
          --only hosting:production
          --project "${{ secrets.GCP_PROJECT_ID }}"
          --non-interactive